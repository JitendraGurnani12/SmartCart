            <li class="nav-item"

            <li class="nav-item"
                *ngIf="this.authService.isCustomer()">

                <a class="nav-link"
                routerLink="/orders"
                routerLinkActive="active">

                </a>

            </li>

            <li class="nav-item"
                *ngIf="this.authService.isCustomer()">

                routerLink="/cart"

                        {{ cartBadageCount }}

                    </span>

                </a>

            </li>

            <!-- Seller -->
            <li class="nav-item"
                *ngIf="this.authService.isSeller()">

                <a class="nav-link"

                </a>

            </li>

                routerLinkActive="active">

                        </li>
